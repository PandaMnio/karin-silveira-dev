name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v6

      # Lista explícita: só o que o site usa entra no artefato.
      - name: Montar o artefato
        run: |
          mkdir _site
          cp --parents \
            index.html 404.html sitemap.xml \
            styles/*.css scripts/*.js \
            projetos/index.html projetos/*/index.html \
            assets/favicon.svg assets/apple-touch-icon.png \
            assets/fonts/* assets/icons/* assets/share/* \
            assets/images/*.webp assets/images/psicologia/* \
            _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
