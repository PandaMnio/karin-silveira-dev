name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Lista explícita: só o que o site usa entra no artefato.
      - name: Montar o artefato
        run: |
          mkdir _site
          cp --parents \
            index.html 404.html sitemap.xml \
            styles/*.css scripts/*.js \
            projetos/index.html projetos/*/index.html curriculo/index.html laboratorio/index.html \
            assets/favicon.svg assets/apple-touch-icon.png \
            assets/fonts/* assets/icons/* assets/share/* \
            assets/images/*.webp assets/images/psicologia/* assets/images/spectrum/* \
            _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
